<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Трекер рабочего времени</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            padding: 30px;
            background-color: #f9f9f9;
        }
        h1, h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        table {
            margin-bottom: 30px;
        }
        .button {
            padding: 5px 10px;
            margin-left: 5px;
            font-size: 14px;
        }
        .message {
            text-align: center;
            margin-bottom: 20px;
        }
        .drag-handle {
            cursor: move;
        }
        #loader {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
        }
    </style>
</head>
<body>
<div id="loader" class="spinner-border text-primary"></div>
<div class="container">
    <div class="text-end mb-3 d-flex justify-content-end gap-2 flex-wrap">
        <button class="btn btn-outline-secondary" onclick="window.location.href='/new-tracker.html'">🆕 Новый трекер</button>
        <button class="btn btn-outline-primary" onclick="window.location.href='/finance.html'">💳 Финансы</button>
        <button class="btn btn-success d-none" data-vpn-link onclick="window.location.href='/vpn-keys'">🛡️ VPN ключи</button>
        <button class="btn btn-danger" onclick="logout()">Выйти</button>
    </div>
    <h1>Трекер рабочего времени</h1>
    <div class="text-center mb-3">
        <h4>Привет, <span id="username">Пользователь</span>!</h4>
    </div>
    <div class="message" id="message"></div>

    <div class="text-center mb-3 d-flex flex-wrap justify-content-center align-items-center gap-2">
        <input type="date" id="datePicker" class="form-control d-inline-block w-auto" />
        <button type="button" class="btn btn-primary" id="openClassicModal">➕ Новая запись</button>
    </div>

    <div class="text-center mb-3">
        <h3>Отработано часов за день: <span id="workedHours">0</span></h3>
    </div>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>Час</th>
            <th>Начало</th>
            <th>Конец</th>
            <th>Работал?</th>
            <th>Комментарий</th>
            <th>Статус</th>
            <th>Действие</th>
        </tr>
        </thead>
        <tbody id="timeEntriesTable"></tbody>
    </table>

    <h2 class="mt-5">Карточки дня</h2>
    <div id="timeEntriesList" class="row row-cols-1 row-cols-md-2 g-3"></div>

    <h2>Управление статусами</h2>
    <div class="text-center mb-3">
        <input type="text" id="newStatusName" placeholder="Новый статус" class="form-control d-inline-block w-auto" />
        <button class="btn btn-primary button" onclick="addStatus()">Добавить</button>
    </div>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th></th>
            <th>ID</th>
            <th>Название</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody id="statusTableBody"></tbody>
    </table>
</div>

<div class="modal fade" id="classicEntryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form id="classicEntryForm" novalidate>
                <div class="modal-header">
                    <h5 class="modal-title" id="classicModalTitle">Новая запись</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-sm-6">
                            <label for="classicStartTime" class="form-label">Начало</label>
                            <input type="time" class="form-control" id="classicStartTime" required>
                        </div>
                        <div class="col-sm-6">
                            <label for="classicEndTime" class="form-label">Конец</label>
                            <input type="time" class="form-control" id="classicEndTime" required>
                        </div>
                        <div class="col-12">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="classicWorked">
                                <label class="form-check-label" for="classicWorked">Отработано</label>
                            </div>
                        </div>
                        <div class="col-12">
                            <label for="classicStatus" class="form-label">Статус</label>
                            <select id="classicStatus" class="form-select">
                                <option value="">—</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label for="classicComment" class="form-label">Комментарий</label>
                            <input type="text" class="form-control" id="classicComment" placeholder="Введите комментарий">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="scripts.js"></script>
</body>
</html>
